<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HábitoTracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MENÚ -->
    <nav id="menu">
        <a href="#" id="link-inicio">Inicio</a>
        <a href="#" id="link-seguimiento">Ver seguimiento</a>
    </nav>

    <!-- FORMULARIO FASE 2 -->
    <form id="form-habito">
        <h2>Crear Hábito</h2>
        <input type="text" id="habito-nombre" placeholder="Nombre" required>
        <input type="text" id="habito-desc" placeholder="Descripción">
        <select id="habito-cat">
            <option value="Salud">Salud</option>
            <option value="Estudio">Estudio</option>
            <option value="Ocio">Ocio</option>
        </select>
        <button type="submit">Crear</button>
    </form>

    <hr>

    <!-- FORMULARIO FASE 3 -->
    <form id="form-registro">
        <h2>Registrar Día</h2>
        <select id="reg-habitoId" required>
            <!-- Las opciones se generarán por JS -->
        </select>
        <input type="date" id="reg-fecha" required>
        <input type="text" id="reg-obs" placeholder="Observaciones">
        <label><input type="checkbox" id="reg-cumplido"> ¿Cumplido?</label>
        <button type="submit">Registrar</button>
    </form>

    <!-- MODAL FASE 4 -->
    <div id="mi-modal" class="modal oculto">
        <div class="modal-contenido">
            <span class="cerrar">&times;</span>
            <h2>Tabla de Seguimiento</h2>
            <table id="tabla-registros">
                <thead>
                    <tr>
                        <th>Hábito</th>
                        <th>Fecha</th>
                        <th>Observaciones</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Filas que se pintarán luego -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
