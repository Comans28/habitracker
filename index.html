<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HábitoTracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- FASE 4: MENÚ -->
    <nav id="menu">
        <a href="#" id="link-inicio">Inicio</a>
        <a href="#" id="link-seguimiento">Ver seguimiento</a>
    </nav>

    <!-- FASE 2: FORMULARIO CREAR HÁBITO -->
    <form id="form-habito">
        <h2>Crear Hábito</h2>
        <input type="text" id="habito-nombre" placeholder="Nombre" required>
        <input type="text" id="habito-desc" placeholder="Descripción">
        <select id="habito-cat">
            <option value="Salud">Salud</option>
            <option value="Estudio">Estudio</option>
            <option value="Ocio">Ocio</option>
        </select>
        <button type="submit">Crear</button>
    </form>

    <hr>

    <!-- FASE 6: ESTADÍSTICAS -->
    <div id="estadisticas" style="background: #f4f4f9; padding: 15px; margin-bottom: 20px; border-left: 4px solid #333;">
        <h3 style="margin-top: 0;">📊 Resumen de seguimiento</h3>
        <p>Total Hábitos: <strong id="stat-habitos">0</strong></p>
        <p>Días Cumplidos: <strong id="stat-cumplidos">0</strong></p>
        <p>Días Fallados: <strong id="stat-fallados">0</strong></p>
        <button id="btn-borrar" style="background: #ff4c4c; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; margin-top: 10px;">Borrar todos los datos</button>
    </div>

    <!-- FASE 3: FORMULARIO REGISTRAR DÍA -->
    <form id="form-registro">
        <h2>Registrar Día</h2>
        <select id="reg-habitoId" required>
            <!-- Las opciones se generarán por JS -->
        </select>
        <input type="date" id="reg-fecha" required>
        <input type="text" id="reg-obs" placeholder="Observaciones">
        <label><input type="checkbox" id="reg-cumplido"> ¿Cumplido?</label>
        <button type="submit">Registrar</button>
    </form>

    <!-- FASE 4: MODAL CON LA TABLA -->
    <div id="mi-modal" class="modal oculto">
        <div class="modal-contenido">
            <span class="cerrar">&times;</span>
            <h2>Tabla de Seguimiento</h2>
            <table id="tabla-registros">
                <thead>
                    <tr>
                        <th>Hábito</th>
                        <th>Fecha</th>
                        <th>Observaciones</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Filas generadas por JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
